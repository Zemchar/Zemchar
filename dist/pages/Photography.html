<body class="bg-gray-600">
    <div id="main" style="display: flex; height: 100vh; width: 100vw; text-align: center">
        <div style="margin: auto; align-content: center">
            <p style="font-size: xxx-large">Hey! My photo portfolio is currently just on instagram.</p>
            <p style="font-size: x-large">And! My cinematography work is <a href="https://www.imdb.com/name/nm18763993/" target="_blank" style="color: hotpink">on IMDB</p>
            <p style="font-size: large">And! I was First AC & Best Electric on the NYC unit production of LVCRFT's <a href="https://youtube.com/watch?v=PlQ4BRNXKVs" target="_blank" style="color: hotpink">My Boo!</p>
            <p style="font-size: xx-large">Redirecting in <span id="countdown" style="color: hotpink">5</span> seconds</p>
        </div>
    </div>
    <script>
        let time = 5;
        let countdown = document.getElementById('countdown');
        let interval = setInterval(() => {
            time--;
            countdown.innerText = time;
            if (time === 0) {
                clearInterval(interval);
                window.location.href = "http://instagram.com/zemchar/";
            }
        }, 1000);
</script>
